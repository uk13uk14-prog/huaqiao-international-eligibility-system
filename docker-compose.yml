version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: huaqiao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-huaqiao_dev}
      POSTGRES_DB: huaqiao
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huaqiao"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-free:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://huaqiao:${POSTGRES_PASSWORD:-huaqiao_dev}@postgres:5432/huaqiao_free
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      ENV: ${ENV:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://huaqiao.example.com}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend-saas:
    build: ./huaqiao-saas-pro/backend
    environment:
      DATABASE_URL: postgresql+psycopg://huaqiao:${POSTGRES_PASSWORD:-huaqiao_dev}@postgres:5432/huaqiao_saas
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      VAULT_FERNET_KEY: ${VAULT_FERNET_KEY}
      ENV: ${ENV:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://huaqiao.example.com}
      WECHAT_MCH_ID: ${WECHAT_MCH_ID:-}
      WECHAT_API_KEY: ${WECHAT_API_KEY:-}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8002:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend-free

volumes:
  pgdata:
