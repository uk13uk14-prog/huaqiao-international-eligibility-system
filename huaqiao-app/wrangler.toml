# Fixed H5 preview for 国侨升学 mobile (huaqiao-app)
# Deploy target: Cloudflare Workers Static Assets → https://guoqiao-mobile-preview.workers.dev
# Do NOT reuse / delete the mistaken Worker: huaqiao-international-eligibility-system
#
# Deployed via GitHub Actions on push to cursor/mobile-cloud-preview (see
# .github/workflows/deploy-h5-preview.yml). Requires repo secrets:
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID

name = "guoqiao-mobile-preview"
compatibility_date = "2025-09-04"

# Static SPA shell from Vite outDir=dist (no Worker script required)
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
