name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, cursor/mobile-cloud-preview]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: huaqiao
          POSTGRES_PASSWORD: test
          POSTGRES_DB: huaqiao_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        run: |
          cd backend && pip install -r requirements-locked.txt
          cd ../huaqiao-saas-pro/backend && pip install -r requirements-locked.txt
          # Test/runtime extras not pinned in *-locked (psycopg3 dialect URLs + pytest)
          pip install "psycopg[binary]==3.2.3" "httpx==0.27.0" "pytest==8.3.5"
      - name: Create CI databases
        env:
          PGPASSWORD: test
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql -h localhost -U huaqiao -d huaqiao_test -c "SELECT 1" >/dev/null
          psql -h localhost -U huaqiao -d postgres -tc "SELECT 1 FROM pg_database WHERE datname='huaqiao_free'" | grep -q 1 \
            || psql -h localhost -U huaqiao -d postgres -c "CREATE DATABASE huaqiao_free;"
          psql -h localhost -U huaqiao -d postgres -tc "SELECT 1 FROM pg_database WHERE datname='huaqiao_saas'" | grep -q 1 \
            || psql -h localhost -U huaqiao -d postgres -c "CREATE DATABASE huaqiao_saas;"
      - name: Run backend tests
        env:
          DATABASE_URL: postgresql+psycopg://huaqiao:test@localhost:5432/huaqiao_free
          ADMIN_TOKEN: test-admin-token
          ENV: development
        run: cd backend && python -m pytest tests/ -v
      - name: Run saas-pro tests
        env:
          DATABASE_URL: postgresql+psycopg://huaqiao:test@localhost:5432/huaqiao_saas
          JWT_SECRET_KEY: test-jwt-key
          VAULT_FERNET_KEY: ${{ secrets.VAULT_FERNET_KEY }}
          ENV: development
        run: |
          # Empty GitHub secret becomes "" and blocks conftest setdefault — generate if missing.
          if [ -z "${VAULT_FERNET_KEY:-}" ]; then
            export VAULT_FERNET_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          fi
          cd huaqiao-saas-pro/backend && python -m pytest tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build frontend
        run: cd frontend && npm ci && npm run build
      - name: Build huaqiao-app
        run: cd huaqiao-app && npm ci && npm run build
      - name: Build saas-pro frontend
        run: cd huaqiao-saas-pro/frontend && npm ci && npm run build
      - name: Build huaqiao-admin
        run: |
          cd huaqiao-admin
          npm ci || npm install
          VITE_ADMIN_API_BASE=https://api.guoqiaoplan.com npm run build

  alembic-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: huaqiao
          POSTGRES_PASSWORD: test
          POSTGRES_DB: huaqiao_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Create CI databases
        env:
          PGPASSWORD: test
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql -h localhost -U huaqiao -d postgres -tc "SELECT 1 FROM pg_database WHERE datname='huaqiao_free'" | grep -q 1 \
            || psql -h localhost -U huaqiao -d postgres -c "CREATE DATABASE huaqiao_free;"
          psql -h localhost -U huaqiao -d postgres -tc "SELECT 1 FROM pg_database WHERE datname='huaqiao_saas'" | grep -q 1 \
            || psql -h localhost -U huaqiao -d postgres -c "CREATE DATABASE huaqiao_saas;"
      - name: Check free-backend migrations
        env:
          DATABASE_URL: postgresql+psycopg://huaqiao:test@localhost:5432/huaqiao_free
        run: |
          cd backend
          pip install -r requirements-locked.txt "psycopg[binary]==3.2.3"
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Check saas-pro migrations (through 009)
        env:
          DATABASE_URL: postgresql+psycopg://huaqiao:test@localhost:5432/huaqiao_saas
        run: |
          cd huaqiao-saas-pro/backend
          pip install -r requirements-locked.txt "psycopg[binary]==3.2.3"
          alembic upgrade head
          alembic current | grep -q 009_csca_notification_rules
          alembic downgrade 008_notification_center_v1
          alembic upgrade head
          alembic current | grep -q 009_csca_notification_rules
