name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  deploy-staging:
    if: github.event_name == 'push' || github.event.inputs.target == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging
        run: echo "Deploying to staging environment..."
      - name: Run smoke tests
        run: echo "Running smoke tests against staging..."

  deploy-production:
    if: github.event.inputs.target == 'production'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://huaqiao.example.com
    needs: []
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        run: echo "Deploying to production environment..."
      - name: Run smoke tests
        run: echo "Running smoke tests against production..."
