name: Deploy H5 Preview

on:
  push:
    branches:
      - cursor/mobile-cloud-preview
    paths:
      - "huaqiao-app/**"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-h5-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h5-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy H5 static Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            huaqiao-app/package-lock.json

      - name: Install root (wrangler)
        run: npm install

      - name: Build huaqiao-app
        run: npm run build:h5
        env:
          # Empty GitHub vars must not override .env.production — always resolve to HTTPS origin
          VITE_API_BASE: ${{ vars.VITE_API_BASE != '' && vars.VITE_API_BASE || 'https://api.guoqiaoplan.com' }}
          VITE_SAAS_API: ${{ vars.VITE_SAAS_API != '' && vars.VITE_SAAS_API || 'https://api.guoqiaoplan.com' }}

      - name: Verify dist
        run: |
          test -f huaqiao-app/dist/index.html
          test -d huaqiao-app/dist/assets
          ls -la huaqiao-app/dist huaqiao-app/dist/assets

      - name: Deploy to Cloudflare Workers (static assets)
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: deploy
          # Uses repo-root wrangler.toml → Worker huaqiao-international-eligibility-system

      - name: Skip note when secrets absent
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' || secrets.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "GitHub secrets not set; Cloudflare Git Workers Builds remains the primary auto-deploy path."
          echo "Root wrangler.toml + [build].command must satisfy: npx wrangler versions upload"
